<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Dashboard</title>
</head>

<body>
    <main>
        <h2>Dashboard</h2>
        <div class="perfil">
        </div>
        <p>Desempenho</p>
        <div class="card-info">
            <br>
            <div class="card">
                <i class="bi bi-check-circle-fill"></i>
                <p>0%</p>
                <h4>Concluidas</h4>
            </div>
            <br>
            <div class="card">
                <i class="bi bi-alarm-fill"></i>
                <p>0%</p>
                <h4>Em Andamento</h4>
            </div>
            <br>
            <div class="card">
                <i class="bi bi-exclamation-circle-fill"></i>
                <p>0%</p>
                <h4>Pendente</h4>
            </div>
        </div>

        <button id="adicao" onclick="criar()">
            <i class="bi bi-plus-circle"></i><br>Nova tarefa
        </button>
        <div class="linha"></div>
        <p>Sem Atividades</p>
        <!-- ----------Modal de Atividade ------------ -->
        <section class="container-modal">
            <div class="modal">
                <h2>Criar Atividade</h2>
                <form>
                    <label for="titulo">Titulo</label>
                    <br>
                    <input type="text" name="titulo" id="titulo">
                    <br><br>
                    <label for="data">Prazo</label>
                    <br>
                    <input type="date" name="data" id="data">
                    <br><br>
                    <label for="urgencia">Urgencia</label>
                    <br>
                    <input type="text" name="urgencia" id="urgencia">
                    <br><br>
                    <input type="button" value="Criar Atividade" id="criar">
                    <input type="button" value="Cancelar" id="cancelar" onclick="cancel()">
                </form>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
